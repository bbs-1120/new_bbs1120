# Cloud Build設定
# トリガーからの自動デプロイ、または手動デプロイ用

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Dockerイメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/growth-weekly-report:latest'
      - '.'

  # Container Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/growth-weekly-report:latest'

  # Cloud Runにデプロイ（既存サービスのイメージを更新）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'growth-weekly-report'
      - '--image'
      - 'gcr.io/$PROJECT_ID/growth-weekly-report:latest'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/growth-weekly-report:latest'

timeout: '1200s'
